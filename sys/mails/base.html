<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{subject}}</title>
<style>
  /* Clients that keep <style> get these; everything essential is inline. */
  a { color: #1E3F30; }
  @media (max-width: 620px) {
    .rt-pad { padding-left: 24px !important; padding-right: 24px !important; }
    .rt-mast { font-size: 26px !important; }
    .rt-h1 { font-size: 30px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#F3F0E8;-webkit-text-size-adjust:100%;">
<!-- Preview text in the inbox list, hidden in the message. -->
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#F3F0E8;">{{preheader}}&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;&#8199;&#65279;&#847;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F3F0E8" style="background:#F3F0E8;">
<tr><td align="center" style="padding:40px 12px;">

<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">

<!-- masthead -->
<tr><td class="rt-pad" align="center" style="padding:0 40px 28px;">
  <a href="{{site_url}}" class="rt-mast" style="font-family:'Cormorant Garamond',Garamond,Georgia,'Times New Roman',serif;font-size:30px;line-height:1.15;font-weight:normal;color:#17201C;text-decoration:none;">{{site_name}}</a>
  <div style="margin-top:8px;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:16px;line-height:1.4;color:#4A524C;">{{site_tagline}}</div>
</td></tr>
<tr><td style="border-top:1px solid #17201C;font-size:0;line-height:0;">&nbsp;</td></tr>

<!-- message -->
<tr><td class="rt-pad" style="padding:36px 40px 40px;font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.65;color:#17201C;">
{{content}}
{{button}}
</td></tr>

<!-- footer -->
<tr><td style="border-top:1px solid #C9C2B0;font-size:0;line-height:0;">&nbsp;</td></tr>
<tr><td class="rt-pad" style="padding:20px 40px 0;font-family:Georgia,'Times New Roman',serif;font-size:13px;line-height:1.6;color:#4A524C;">
{{footer_extra}}
<p style="margin:0;">{{site_name}} &middot; <a href="{{site_url}}" style="color:#4A524C;">{{site_host}}</a> &middot; written by a human.</p>
</td></tr>

</table>
</td></tr>
</table>
</body>
</html>
