# roytalk -- nginx front for GNU Artanis (the app speaks HTTP on 127.0.0.1:3000).
#
# Install:
#   sudo apt-get install -y nginx
#   sudo install -m 644 deploy/nginx-roytalk.conf /etc/nginx/sites-available/roytalk.conf
#   sudo ln -sf /etc/nginx/sites-available/roytalk.conf /etc/nginx/sites-enabled/roytalk.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# It listens on loopback only. cloudflared terminates TLS at the edge and
# points at it (deploy/cloudflared.yml.example), so the VM opens no inbound
# port. To serve TLS here instead, add a second server block with
# `listen 443 ssl;` and the certificate, and point cloudflared there.

# --- client address ---------------------------------------------------------
# Behind cloudflared every connection comes from 127.0.0.1, and the edge puts
# the client address in CF-Connecting-IP. Trust it only from loopback: that is
# safe precisely because nothing but the local tunnel can reach this listener.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;

# --- rate limits ------------------------------------------------------------
# Per client IP. The app rate-limits too; this is the coarse outer layer that
# keeps floods from reaching it.
limit_req_zone $binary_remote_addr zone=roytalk_req:10m      rate=20r/s;
limit_req_zone $binary_remote_addr zone=roytalk_sensitive:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=roytalk_api:10m       rate=5r/s;
limit_conn_zone $binary_remote_addr zone=roytalk_conn:10m;

limit_req_status 429;
limit_conn_status 429;

upstream roytalk_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 127.0.0.1:8080;
    server_name roytalk.com;

    # Cloudflare terminates TLS and re-sends the request to this listener over
    # plain HTTP, recording the scheme the client actually used in
    # X-Forwarded-Proto. Anything that reached the edge over http goes back to
    # https. (Cloudflare's "Always Use HTTPS" setting does the same at the
    # edge; this is the safety net for when it is off.)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Do not reveal nginx's own version on responses nginx generates itself
    # (static files, error pages), but pass the upstream Server header through
    # on proxied responses: advertising the GNU Artanis version is deliberate.
    server_tokens off;
    proxy_pass_header Server;
    proxy_hide_header X-Powered-By;

    access_log /var/log/nginx/roytalk.access.log;
    error_log  /var/log/nginx/roytalk.error.log warn;

    # Artanis rejects requests over 1 MB itself (upload.size); leave a little
    # room for the request line and headers.
    client_max_body_size 2m;
    client_header_timeout 30s;
    client_body_timeout   30s;
    send_timeout          30s;
    keepalive_timeout     65s;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # Static assets are plain files under pub/ (pub/css, pub/js, pub/img,
    # pub/fonts). Serve them from disk with a cache lifetime instead of
    # proxying every request to Artanis. The prefixes are matched with ^~ so
    # they win over the regex locations below and never fall through to the
    # app. This is by directory, not by file extension, because /robots.txt
    # and /sitemap.xml are dynamic routes handled by the app. Change this path
    # if the app is installed somewhere other than /var/www/roytalk.
    root /var/www/roytalk/pub;

    location ^~ /css/ {
        expires 12h;
        access_log off;
    }

    location ^~ /js/ {
        expires 12h;
        access_log off;
    }

    location ^~ /fonts/ {
        expires 30d;
        access_log off;
    }

    location ^~ /img/ {
        expires 30d;
        access_log off;
    }

    # Browsers and feed readers ask for /favicon.ico at the site root even when
    # the pages link /img/favicon.svg; answer from the same file, not the app.
    location = /favicon.ico {
        try_files /img/favicon.ico =404;
        expires 30d;
        access_log off;
    }

    # --- proxy defaults, inherited by every location -----------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # The app's own limits read CF-Connecting-IP first (lib/roytalk/web.scm),
    # so keep it equal to the address nginx resolved above.
    proxy_set_header CF-Connecting-IP  $remote_addr;

    proxy_connect_timeout 5s;
    proxy_send_timeout    75s;
    proxy_read_timeout    75s;
    proxy_redirect off;

    # Sign-in, OAuth and newsletter endpoints send mail: the strictest bucket.
    location ~ ^/(signin|auth|welcome|letter|me/email)(/|$) {
        limit_req zone=roytalk_sensitive burst=5 nodelay;
        limit_conn roytalk_conn 8;
        proxy_pass http://roytalk_app;
    }

    location ^~ /api/ {
        limit_req zone=roytalk_api burst=20 nodelay;
        limit_conn roytalk_conn 8;
        proxy_pass http://roytalk_app;
    }

    # /search runs a full-text query in Postgres for every request, so give it
    # the same tighter bucket as the API instead of the general one.
    location = /search {
        limit_req zone=roytalk_api burst=10 nodelay;
        limit_conn roytalk_conn 4;
        proxy_pass http://roytalk_app;
    }

    location / {
        limit_req zone=roytalk_req burst=50 nodelay;
        limit_conn roytalk_conn 32;
        proxy_pass http://roytalk_app;
    }
}
