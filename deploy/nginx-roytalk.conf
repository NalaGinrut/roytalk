# roytalk -- nginx front for GNU Artanis (the app speaks HTTP on 127.0.0.1:3000).
#
# Install:
#   sudo apt-get install -y nginx
#   sudo install -m 644 deploy/nginx-roytalk.conf /etc/nginx/sites-available/roytalk.conf
#   sudo ln -sf /etc/nginx/sites-available/roytalk.conf /etc/nginx/sites-enabled/roytalk.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# It listens on loopback only. cloudflared terminates TLS at the edge and
# points at it (deploy/cloudflared.yml.example), so the VM opens no inbound
# port. To serve TLS here instead, add a second server block with
# `listen 443 ssl;` and the certificate, and point cloudflared there.

# --- client address ---------------------------------------------------------
# Behind cloudflared every connection comes from 127.0.0.1, and the edge puts
# the client address in CF-Connecting-IP. Trust it only from loopback: that is
# safe precisely because nothing but the local tunnel can reach this listener.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;

# --- rate limits ------------------------------------------------------------
# Per client IP. The app rate-limits too; this is the coarse outer layer that
# keeps floods from reaching it.
limit_req_zone $binary_remote_addr zone=roytalk_req:10m      rate=20r/s;
limit_req_zone $binary_remote_addr zone=roytalk_sensitive:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=roytalk_api:10m       rate=5r/s;
limit_conn_zone $binary_remote_addr zone=roytalk_conn:10m;

limit_req_status 429;
limit_conn_status 429;

upstream roytalk_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 127.0.0.1:8080;
    server_name roytalk.com;

    # Do not reveal the nginx version, and drop the upstream banner (GNU
    # Artanis). With nginx-extras installed you can send your own instead:
    #   sudo apt-get install -y nginx-extras
    #   more_set_headers "Server: roytalk";
    server_tokens off;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    access_log /var/log/nginx/roytalk.access.log;
    error_log  /var/log/nginx/roytalk.error.log warn;

    # Artanis rejects requests over 1 MB itself (upload.size); leave a little
    # room for the request line and headers.
    client_max_body_size 2m;
    client_header_timeout 30s;
    client_body_timeout   30s;
    send_timeout          30s;
    keepalive_timeout     65s;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # --- proxy defaults, inherited by every location -----------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # The app's own limits read CF-Connecting-IP first (lib/roytalk/web.scm),
    # so keep it equal to the address nginx resolved above.
    proxy_set_header CF-Connecting-IP  $remote_addr;

    proxy_connect_timeout 5s;
    proxy_send_timeout    75s;
    proxy_read_timeout    75s;
    proxy_redirect off;

    # Sign-in, OAuth and newsletter endpoints send mail: the strictest bucket.
    location ~ ^/(signin|auth|welcome|letter|me/email)(/|$) {
        limit_req zone=roytalk_sensitive burst=5 nodelay;
        limit_conn roytalk_conn 8;
        proxy_pass http://roytalk_app;
    }

    location ^~ /api/ {
        limit_req zone=roytalk_api burst=20 nodelay;
        limit_conn roytalk_conn 8;
        proxy_pass http://roytalk_app;
    }

    location / {
        limit_req zone=roytalk_req burst=50 nodelay;
        limit_conn roytalk_conn 32;
        proxy_pass http://roytalk_app;
    }
}
